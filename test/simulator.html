<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ 插件本地模拟器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font:14px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:#64748b}#status{margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}section{background:white;border:1px solid #dbe2ed;border-radius:12px;padding:20px;margin-bottom:18px}label{display:block;margin:10px 0 4px}input,select,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:8px}input:not([type=checkbox]),select,textarea{width:100%}textarea{resize:vertical;font-family:ui-monospace,monospace}button{background:#1749c9;color:white;cursor:pointer;margin-top:12px}button.secondary{background:white;color:#334155}button:disabled{opacity:.5}.row{display:flex;gap:12px}.row>*{flex:1}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto;font:12px/1.6 ui-monospace,monospace;background:#f8fafc;padding:12px;border-radius:7px}.error{color:#b91c1c}details{margin-top:12px}#notice{min-height:25px}small{color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<main>
<h1>QQ 插件本地模拟器</h1><div id="status" class="muted">正在连接模拟环境…</div>
<div id="notice" role="status"></div>
<div class="grid"><div>
<section><h2>模拟 QQ 发消息</h2>
<div class="row"><div><label for="scope">对话</label><select id="scope"><option value="private">私聊</option><option value="group">群聊</option></select></div><div><label for="peer">QQ 号 / 群号</label><input id="peer" value="11001"></div><div><label for="user">群发言人 QQ 号</label><input id="user" value="11001"></div></div>
<label for="message">正文</label><textarea id="message" rows="3">你好，这是本地测试。</textarea>
<label><input type="checkbox" id="at"> @ 机器人　 <input type="checkbox" id="image"> 附一张本地测试图片</label>
<details><summary>为这一轮编排模型行为</summary><small>留空使用模拟回复。仅模拟动作顺序，不调用真实模型。</small><textarea id="plan" rows="6" placeholder='[{"type":"tool","name":"qq_send","args":{"text":"工具回复"}},{"type":"text","text":"不会重复转发"}]'></textarea><div class="row"><button class="secondary" id="question">填入问答</button><button class="secondary" id="approval">填入审批</button><button class="secondary" id="overflow">填入上下文超限</button></div></details>
<button id="send">发送到真实插件</button>
</section>
<section><h2>插件设置</h2><small>读取和保存都走插件自己的设置 API。连接地址和数据目录固定在模拟环境内。</small><textarea id="settings" rows="9"></textarea><button id="save">保存设置</button><button class="secondary" id="reloadSettings">重新读取</button></section>
<section><h2>故障与生命周期</h2><label for="action">下一次失败的 OneBot API</label><input id="action" value="send_private_msg"><div class="row"><button class="secondary" id="fail">返回失败</button><button class="secondary" id="disconnect">断线后自动重连</button><button class="secondary" id="reload">重载插件与宿主</button></div><small>重载保留本次模拟目录，验证会话恢复和监听器清理。所有发送均落到模拟 NapCat。</small></section>
</div><div>
<section><h2>模拟 QQ 收到的消息 / 空间发布</h2><pre id="outgoing">尚无回复</pre></section>
<section><h2>DSH 会话与工具结果</h2><pre id="sessions">尚无会话</pre></section>
<details><summary>完整入站提示词、事件与工具清单</summary><pre id="state"></pre></details>
<section><h2>插件日志</h2><pre id="logs"></pre></section>
</div></div></main>
<script>
const $=id=>document.getElementById(id)
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const value=await r.json();if(!r.ok)throw Error(value.error||'请求失败');return value}
async function action(fn){try{$('notice').className='';await fn();$('notice').textContent='操作已完成';await refresh()}catch(e){$('notice').className='error';$('notice').textContent=e.message}}
function display(id,value){$(id).textContent=JSON.stringify(value,null,2)}
async function refresh(){try{const s=await request('/mock/state');$('status').textContent=(s.connected?'模拟 NapCat 已连接':'正在重连')+' · 数据目录：'+s.root;display('outgoing',s.calls.filter(c=>c.action.startsWith('send_')||c.action.startsWith('upload_')).slice(-15));display('sessions',s.sessions.map(a=>({id:a.id,cwd:a.header.meta?.cwd,收到消息:a.received.length,注入卡片:a.injected.length,工具:a.tools,结果:a.results})));display('state',s.sessions);$('logs').textContent=s.logs.map(l=>'['+l.level+'] '+l.text).join('\n')}catch(e){$('status').textContent='连接失败：'+e.message}}
async function readSettings(){const s=await request('/api/dsh-qq/settings');const {wsUrl,accessToken,selfId,cwd,workspaceRoot,memoryRoot,...editable}=s.values;$('settings').value=JSON.stringify(editable,null,2)}
$('scope').onchange=()=>{$('peer').value=$('scope').value==='group'?'88888':'11001'}
$('send').onclick=()=>action(async()=>{await request('/mock/message',{scope:$('scope').value,peerId:$('peer').value,userId:$('user').value,text:$('message').value,atSelf:$('at').checked,image:$('image').checked,...($('plan').value.trim()?{steps:JSON.parse($('plan').value)}:{})});$('plan').value=''})
$('save').onclick=()=>action(()=>request('/api/dsh-qq/settings',{patch:JSON.parse($('settings').value)}))
$('reloadSettings').onclick=()=>action(readSettings)
$('fail').onclick=()=>action(()=>request('/mock/fault',{action:$('action').value,fault:{wording:'模拟发送失败'}}))
$('disconnect').onclick=()=>action(()=>request('/mock/disconnect',{}))
$('reload').onclick=()=>action(()=>request('/mock/reload',{}))
$('question').onclick=()=>{$('plan').value=JSON.stringify([{type:'question',questions:[{id:'choice',header:'测试问题',question:'选择一种颜色',options:[{label:'蓝色'},{label:'绿色'}]}]},{type:'text',text:'已收到选择。'}],null,2)}
$('approval').onclick=()=>{$('plan').value=JSON.stringify([{type:'approval',command:'模拟操作，不执行真实命令'},{type:'text',text:'审批流程结束。'}],null,2)}
$('overflow').onclick=()=>{$('plan').value=JSON.stringify([{type:'error',message:'CONTEXT_WINDOW_EXCEEDED'}],null,2)}
readSettings().catch(e=>{$('notice').textContent=e.message});refresh();setInterval(refresh,1000)
</script></html>
